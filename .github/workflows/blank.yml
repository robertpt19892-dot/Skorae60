name: Build BMW E60 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Auto-Fix Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/bmwe60idrive
          FOUND_KT=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$FOUND_KT" ] && [ "$FOUND_KT" != "./app/src/main/java/com/example/bmwe60idrive/MainActivity.kt" ]; then
            cp "$FOUND_KT" app/src/main/java/com/example/bmwe60idrive/MainActivity.kt
          fi
          
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties

          printf "pluginManagement {\n  repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories { google(); mavenCentral() }\n}\nrootProject.name = 'BMW-E60-Launcher'\ninclude ':app'\n" > settings.gradle

          printf "plugins {\n  id 'com.android.application' version '8.2.2' apply false\n  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false\n}\n" > build.gradle

          printf "plugins {\n  id 'com.android.application'\n  id 'org.jetbrains.kotlin.android'\n}\nandroid {\n  namespace 'com.example.bmwe60idrive'\n  compileSdk 34\n  defaultConfig {\n    applicationId 'com.example.bmwe60idrive'\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName '1.0'\n  }\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = '17'\n  }\n}\ndependencies {\n  implementation 'androidx.appcompat:appcompat:1.6.1'\n}\n" > app/build.gradle

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-E60-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
