name: Build BMW E60 APK
name: Build BMW E60 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Ensure Gradle Config Files Exist
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          if [ ! -f settings.gradle ]; then
            printf "pluginManagement {\n  repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories { google(); mavenCentral() }\n}\nrootProject.name = 'BMW-E60-Launcher'\ninclude ':app'\n" > settings.gradle
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-E60-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
